<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Form</title>
</head>
<body>
    <aside class="panel-left">
        <div class="logo-box">
            <img src="odin-lined.png" alt="Odin logo" />
            <span class="logo-text">ODIN</span>
        </div>
    </aside>

    <main class="panel-right">
        <p class="tagline">
            This is not a real online service! You know you need something
            like this in your life to help you realize your deepest dreams.
            Sign up <em>now</em> to get started.
        </p>
        <p class="tagline"> You <em>know</em> you want to.</p>

        <section class="form-section">
            <h2>Let's do this!</h2>

            <form>
                <div class="fields-grid">

                    <div class="field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Thor" required />
                    </div>

                    <div class="field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Odinson" />
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" />
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder=" " required minlength="8" />
                    </div>

                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder=" " required minlength="8" />
                    </div>
                </div>

                <button type="submit" class="btn-create">Create Account</button>

                <p class="login-prompt">
                    Already have an account? <a href="#">Log in</a>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
